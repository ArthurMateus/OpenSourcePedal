name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR branch cancels the run it supersedes; runs on main always finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-msvc:
    name: windows-msvc (Release, /WX)
    # VS 2022 / MSVC v143 is required by AGENTS.md section 3, so pin the image rather than windows-latest.
    runs-on: windows-2022
    steps:
      # LFS objects (the CC0 IRs and DI clips the asset tests read, #69) come from a cache keyed on their object ids,
      # so a run only downloads them when an asset changes (LFS bandwidth quota, PR #107 review).
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: List LFS objects
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Fetch LFS objects
        shell: bash
        run: git lfs pull
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # FETCHCONTENT_BASE_DIR (CMakePresets.json "base"), shared by every preset. ADR-0006 D2: keyed on the pin file.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/OspDependencies.cmake') }}
      - name: Configure
        run: cmake --preset windows-msvc-ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci --output-junit test-results.xml
      # ADR-0008: osp-tonematch presets (factory IRs and --ir-dir with sha256) validate against preset.v1.
      - name: Tone match preset schema
        shell: bash
        run: |
          set -euo pipefail
          pip install jsonschema==4.23.0
          python tools/tonematch/check_preset.py build/release/tools/osp-tonematch.exe
      # REQ-TEST-007. 5 runs, gated on the per-benchmark median (tools/bench/median.py), so one noisy run cannot fail
      # the job. The strict >10% R gate uses runner-derived r0 in budget.d (#83); no extra noise allowance.
      - name: Benchmarks (CPU ceilings and R regression)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, platform
          from datetime import datetime, timezone
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          Path("build/bench-runner.json").write_text(json.dumps({
              "runnerName": os.environ["RUNNER_NAME"],
              "runnerImage": "windows-2022",
              "imageVersion": os.environ.get("ImageVersion"),
              "processor": platform.processor(),
              "measuredAt": datetime.now(timezone.utc).isoformat(),
              "runUrl": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "headRevision": event.get("pull_request", {}).get("head", {}).get("sha", os.environ["GITHUB_SHA"]),
          }, indent=2) + "\n", encoding="utf-8")
          PY
          for i in 1 2 3 4 5; do ./build/release/tests/osp-bench.exe --out "build/bench-$i.json" > /dev/null; done
          python tools/bench/median.py build/bench.json build/bench-[1-5].json
          python tools/bench/check_budget.py build/bench.json
          python tools/bench/verify_gate.py build/bench.json
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-release
          path: |
            build/release/test-results.xml
            build/release/Testing/Temporary/LastTest*.log
            build/bench*.json
          if-no-files-found: warn
          retention-days: 14
      # Paths per AGENTS.md section 3. The .vst3 is a bundle directory; upload-artifact keeps its layout. On a PR the
      # name carries the head commit, not the test-merge commit that github.sha points at.
      - name: Upload standalone and VST3
        uses: actions/upload-artifact@v4
        with:
          name: OpenSourcePedal-${{ github.event.pull_request.head.sha || github.sha }}-win64
          path: |
            build/release/app/OpenSourcePedal_artefacts/Release/Standalone/OpenSourcePedal.exe
            build/release/app/OpenSourcePedal_artefacts/Release/VST3/OpenSourcePedal.vst3
          if-no-files-found: error
          retention-days: 14

  # REQ-TEST-008 (ADR-0007): the packaged VST3 from the Release job, pluginval v1.0.4 (GPL-3.0, CI only, ADR-0006).
  pluginval:
    name: pluginval (v1.0.4, strictness 9)
    needs: windows-msvc
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenSourcePedal-${{ github.event.pull_request.head.sha || github.sha }}-win64
          path: artefacts
      # Release asset of the v1.0.4 tag (published 2024-12-04); SHA-256 measured on 2026-10-26.
      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          $sha = (Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne 'c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab') { throw "pluginval.zip SHA-256 mismatch: $sha" }
          Expand-Archive pluginval.zip -DestinationPath pluginval
      - name: Validate VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pluginval-logs | Out-Null
          ./pluginval/pluginval.exe --strictness-level 9 --validate-in-process --timeout-ms 60000 `
            --output-dir pluginval-logs --validate artefacts/VST3/OpenSourcePedal.vst3 | Tee-Object pluginval-logs/console.txt
          if ($LASTEXITCODE -ne 0) { throw "pluginval failed with exit code $LASTEXITCODE" }
      - name: Upload pluginval logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs
          path: pluginval-logs
          if-no-files-found: warn
          retention-days: 14

  windows-msvc-debug:
    name: windows-msvc-debug (RT checker)
    runs-on: windows-2022
    steps:
      # LFS objects (the CC0 IRs and DI clips the asset tests read, #69) come from a cache keyed on their object ids,
      # so a run only downloads them when an asset changes (LFS bandwidth quota, PR #107 review).
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: List LFS objects
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Fetch LFS objects
        shell: bash
        run: git lfs pull
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/OspDependencies.cmake') }}
      - name: Configure
        run: cmake --preset windows-msvc-debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug --output-junit test-results.xml
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-debug
          path: |
            build/debug/test-results.xml
            build/debug/Testing/Temporary/LastTest*.log
          if-no-files-found: warn
          retention-days: 14
