name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR branch cancels the run it supersedes; runs on main always finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-msvc:
    name: windows-msvc (Release, /WX)
    # VS 2022 / MSVC v143 is required by AGENTS.md section 3, so pin the image rather than windows-latest.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # FETCHCONTENT_BASE_DIR (CMakePresets.json "base"), shared by every preset. ADR-0006 D2: keyed on the pin file.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/OspDependencies.cmake') }}
      - name: Configure
        run: cmake --preset windows-msvc-ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci --output-junit test-results.xml
      # REQ-TEST-007. 5 runs, gated on the per-benchmark median (tools/bench/median.py), so one noisy run cannot fail
      # the job. The R regression gate stays off until budget.json holds r0 values from this runner (#83).
      - name: Benchmarks (CPU ceilings)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do ./build/release/tests/osp-bench.exe --out "build/bench-$i.json" > /dev/null; done
          python tools/bench/median.py build/bench.json build/bench-[1-5].json
          python tools/bench/check_budget.py build/bench.json --no-regression
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-release
          path: |
            build/release/test-results.xml
            build/release/Testing/Temporary/LastTest*.log
            build/bench*.json
          if-no-files-found: warn
          retention-days: 14
      # Paths per AGENTS.md section 3. The .vst3 is a bundle directory; upload-artifact keeps its layout. On a PR the
      # name carries the head commit, not the test-merge commit that github.sha points at.
      - name: Upload standalone and VST3
        uses: actions/upload-artifact@v4
        with:
          name: OpenSourcePedal-${{ github.event.pull_request.head.sha || github.sha }}-win64
          path: |
            build/release/app/OpenSourcePedal_artefacts/Release/Standalone/OpenSourcePedal.exe
            build/release/app/OpenSourcePedal_artefacts/Release/VST3/OpenSourcePedal.vst3
          if-no-files-found: error
          retention-days: 14

  # REQ-TEST-008 (ADR-0007): the packaged VST3 from the Release job, pluginval v1.0.4 (GPL-3.0, CI only, ADR-0006).
  pluginval:
    name: pluginval (v1.0.4, strictness 9)
    needs: windows-msvc
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenSourcePedal-${{ github.event.pull_request.head.sha || github.sha }}-win64
          path: artefacts
      # Release asset of the v1.0.4 tag (published 2024-12-04); SHA-256 measured on 2026-10-26.
      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          $sha = (Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne 'c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab') { throw "pluginval.zip SHA-256 mismatch: $sha" }
          Expand-Archive pluginval.zip -DestinationPath pluginval
      - name: Validate VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pluginval-logs | Out-Null
          ./pluginval/pluginval.exe --strictness-level 9 --validate-in-process --timeout-ms 60000 `
            --output-dir pluginval-logs --validate artefacts/VST3/OpenSourcePedal.vst3 | Tee-Object pluginval-logs/console.txt
          if ($LASTEXITCODE -ne 0) { throw "pluginval failed with exit code $LASTEXITCODE" }
      - name: Upload pluginval logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-logs
          path: pluginval-logs
          if-no-files-found: warn
          retention-days: 14

  windows-msvc-debug:
    name: windows-msvc-debug (RT checker)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/OspDependencies.cmake') }}
      - name: Configure
        run: cmake --preset windows-msvc-debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug --output-junit test-results.xml
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-debug
          path: |
            build/debug/test-results.xml
            build/debug/Testing/Temporary/LastTest*.log
          if-no-files-found: warn
          retention-days: 14
